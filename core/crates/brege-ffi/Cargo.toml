[package]
name = "brege-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "brege_ffi"

[features]
# Mac only: the WebDAV drive for phone folders.
drive = ["dep:brege-drive"]

[dependencies]
brege-drive = { version = "1.0.0-beta.1", path = "../brege-drive", optional = true }
brege-core = { version = "1.0.0-beta.1", path = "../brege-core" }
log = "0.4"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = { version = "0.1", features = ["log"] }
uniffi = "0.32"

[target.'cfg(target_vendor = "apple")'.dependencies]
oslog = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
