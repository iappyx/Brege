[package]
name = "brege-drive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
brege-core = { version = "1.0.0-beta.1", path = "../brege-core" }
brege-features = { version = "1.0.0-beta.1", path = "../brege-features" }
bytes = "1.12.1"
dav-server = { version = "0.11", default-features = false }
futures-util = "0.3.34"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
thiserror = "2.0.20"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = "0.7"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
