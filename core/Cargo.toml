[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "MIT"
authors = ["iappyx"]
homepage = "https://iappyx.github.io/"
publish = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Full DWARF for this dependency tree runs to tens of gigabytes in target/debug, and line tables
# are all a backtrace needs. Reach for `debug = true` by hand when stepping through in a debugger.
[profile.dev]
debug = "line-tables-only"
